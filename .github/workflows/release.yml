name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip wheel --no-deps . --wheel-dir dist
      - name: Download source archives and create checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository_name="${GITHUB_REPOSITORY##*/}"
          curl --fail --location --retry 5 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/refs/tags/${GITHUB_REF_NAME}" \
            --output "${repository_name}-${GITHUB_REF_NAME}.tar.gz"
          curl --fail --location --retry 5 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/zip/refs/tags/${GITHUB_REF_NAME}" \
            --output "${repository_name}-${GITHUB_REF_NAME}.zip"
          sha256sum dist/* \
            "${repository_name}-${GITHUB_REF_NAME}.tar.gz" \
            "${repository_name}-${GITHUB_REF_NAME}.zip" \
            > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            SHA256SUMS.txt \
            --generate-notes
