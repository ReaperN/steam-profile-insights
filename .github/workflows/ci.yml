name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install .[dev]
      - name: Check syntax
        run: python -m compileall -q main.py src tests
      - name: Lint
        run: ruff check main.py src tests
      - name: Type check
        run: pyright
      - name: Run tests
        run: python -m pytest
